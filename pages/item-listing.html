<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Listing - PasaGamit</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <header>
        <!-- Header structure as in index.html -->
    </header>

    <main>
        <section class="item-form">
            <div class="container">
                <h2>Post an Item</h2>
                <form id="itemForm">
                    <div>
                        <label for="title">Title:</label>
                        <input type="text" id="title" required>
                    </div>
                    <div>
                        <label for="description">Description:</label>
                        <textarea id="description" required></textarea>
                    </div>
                    <div>
                        <label for="photo">Photo:</label>
                        <input type="file" id="photo" accept="image/*" required>
                        <div id="photo-preview"></div>
                    </div>
                    <div>
                        <label for="price">Price:</label>
                        <input type="number" id="price" required>
                    </div>
                    <div>
                        <label for="condition">Condition:</label>
                        <select id="condition">
                            <option value="new">New</option>
                            <option value="like-new">Like New</option>
                            <option value="used">Used</option>
                        </select>
                    </div>
                    <div>
                        <label for="category">Category:</label>
                        <select id="category">
                            <option value="textbooks">Textbooks</option>
                            <option value="uniforms">Uniforms</option>
                            <!-- Additional categories -->
                        </select>
                    </div>
                    <div>
                        <label for="course">Course:</label>
                        <select id="course">
                            <option value="all">All</option>
                            <option value="calculus">Calculus</option>
                            <option value="english">English</option>
                            <!-- Additional courses -->
                        </select>
                    </div>
                    <div>
                        <label for="year">Year Level:</label>
                        <select id="year">
                            <option value="all">All</option>
                            <option value="freshman">Freshman</option>
                            <option value="sophomore">Sophomore</option>
                            <!-- Additional year levels -->
                        </select>
                    </div>
                    <div>
                        <label for="trade">Trade Preference:</label>
                        <select id="trade">
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Post Item</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <!-- Footer structure as in index.html -->
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/item.js"></script>
</body>

</html>
