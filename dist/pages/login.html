<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/PasaGamit/vite.svg" />
    <meta name="description"
        content="Log in or register for PasaGamit — the student marketplace. Verified students post and trade for free." />
    <title>Log In / Register — PasaGamit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500;700&family=Permanent+Marker&display=swap"
        rel="stylesheet" />
  <script type="module" crossorigin src="/PasaGamit/assets/login-qM9jvgOH.js"></script>
  <link rel="modulepreload" crossorigin href="/PasaGamit/assets/main-BXhKCHyo.js">
  <link rel="stylesheet" crossorigin href="/PasaGamit/assets/main-D5AvmhrX.css">
</head>

<body>
    <main id="main" class="site-main container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/index.html">Home</a> / Log In · Register</nav>

        <div class="auth-wrap">
            <div class="auth-card">
                <h1>PasaGamit</h1>
                <p class="auth-sub">The student marketplace for pre-loved textbooks, uniforms, gadgets, and more.</p>

                <!-- Auth tabs -->
                <div class="profile-tabs" role="tablist" aria-label="Log in or register">
                    <button class="profile-tab" id="tab-login" data-tab="login" aria-selected="true" role="tab">Log
                        In</button>
                    <button class="profile-tab" id="tab-register" data-tab="register" aria-selected="false" role="tab">Register</button>
                </div>

                <!-- Login form -->
                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="l-email">Email address</label>
                        <input id="l-email" name="email" type="email" placeholder="you@university.edu.ph" />
                        <span class="error-msg"></span>
                    </div>
                    <div class="field">
                        <label for="l-password">Password</label>
                        <input id="l-password" name="password" type="password" placeholder="••••••" />
                        <span class="error-msg"></span>
                    </div>
                    <button class="btn btn--primary btn--block" type="submit">Log in</button>
                    <p class="auth-switch" style="text-align:center;margin-top:var(--space-3)">
                        Don't have an account? <button type="button" id="go-register" class="auth-switch-btn"
                            style="background:none;border:none;color:var(--color-primary);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:inherit">Register</button>
                    </p>
                </form>

                <!-- Register form -->
                <form id="register-form" style="display:none" novalidate>
                    <div class="field">
                        <label for="r-name">Full name</label>
                        <input id="r-name" name="name" type="text" placeholder="Juan Dela Cruz" />
                        <span class="error-msg"></span>
                    </div>
                    <div class="field">
                        <label for="r-email">Email address</label>
                        <input id="r-email" name="email" type="email" placeholder="you@university.edu.ph" />
                        <span class="error-msg"></span>
                    </div>
                    <div class="field">
                        <label for="r-verify">School email or student ID</label>
                        <input id="r-verify" name="verify" type="text"
                            placeholder="you@university.edu.ph or 2023001" />
                        <span class="error-msg"></span>
                    </div>
                    <div class="field">
                        <label for="r-password">Password</label>
                        <input id="r-password" name="password" type="password" placeholder="••••••" />
                        <span class="error-msg"></span>
                    </div>
                    <button class="btn btn--primary btn--block" type="submit">Create account</button>
                    <p class="auth-switch" style="text-align:center;margin-top:var(--space-3)">
                        Already have an account? <button type="button" id="go-login" class="auth-switch-btn"
                            style="background:none;border:none;color:var(--color-primary);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:inherit">Log
                            in</button>
                    </p>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
